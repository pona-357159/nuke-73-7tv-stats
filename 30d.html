        const currentEmotes = rawEmotes.map(e => ({
            ...e,
            imgUrl: e.emoteId ? `https://cdn.7tv.app/emote/${e.emoteId}/2x.webp` : '',

        function updateSummaryStats(emotes) {
            const totalEmotes = emotes.length;
            const totalUses = emotes.reduce((acc, e) => acc + e.count, 0);
            const mostUsed = emotes.length ? [...emotes].sort((a, b) => b.count - a.count)[0] : null;
            const avgUses = totalEmotes ? Math.round(totalUses / totalEmotes) : 0;

            document.getElementById('summaryTotalEmotes').textContent = totalEmotes.toLocaleString();
            document.getElementById('summaryTotalUses').textContent = totalUses.toLocaleString();

            const container = img.closest('.emote-img-skeleton') || img.parentElement;
            if (container) {
                container.classList.remove('emote-img-skeleton');
            }
        }

        function handleImgError(img) {
            if (!img) return;
            const container = img.closest('.emote-img-skeleton') || img.parentElement;
            if (container) {
                container.classList.remove('emote-img-skeleton');
                const originalSrc = img.getAttribute('src');
                container.innerHTML = `

        function reloadEmoteImg(btn, src) {
            const container = btn.parentElement;
            container.classList.add('emote-img-skeleton');
            const newImg = document.createElement('img');
            newImg.alt = "Emote";
            newImg.loading = "lazy";
            newImg.decoding = "async";
            newImg.className = "max-h-14 max-w-full object-contain group-hover:scale-110 transition-transform";
            newImg.onload = function() { handleImgLoad(newImg); };
            newImg.onerror = function() { handleImgError(newImg); };
            const cacheBustSrc = src.includes('?') ? `${src}&t=${Date.now()}` : `${src}?t=${Date.now()}`;
            newImg.src = cacheBustSrc;
            container.innerHTML = '';
            container.appendChild(newImg);
            if (newImg.complete && newImg.naturalWidth !== 0) {

                if (sortMode === 'count-desc') return b.count - a.count;
                if (sortMode === 'count-asc') return a.count - b.count;
                if (sortMode === 'name-asc') return a.name.localeCompare(b.name);
                if (sortMode === 'name-desc') return b.name.localeCompare(a.name);
                if (sortMode === 'added-desc') return b.addedTimestamp - a.addedTimestamp;
                if (sortMode === 'added-asc') return a.addedTimestamp - b.addedTimestamp;
                if (sortMode === 'used-desc') return b.lastUsedTimestamp - a.lastUsedTimestamp;
                if (sortMode === 'used-asc') return a.lastUsedTimestamp - b.lastUsedTimestamp;
                return 0;
            });

            if (filtered.length === 0) {
                gridViewContainer.classList.add('hidden');
                tableViewContainer.classList.add('hidden');
                noResults.classList.remove('hidden');
                return;
            }

            noResults.classList.add('hidden');

            if (currentView === 'grid') {
                gridViewContainer.classList.remove('hidden');
                tableViewContainer.classList.add('hidden');

                gridViewContainer.innerHTML = filtered.map(e => {
                    const topUsersHtml = e.topUsersList && e.topUsersList.length > 0 ? `
                        <div class="top-users-popover text-left">
                            <div class="text-[10px] uppercase font-bold text-purple-400 border-b border-gray-700 pb-1 mb-1.5">Top Users</div>
                            <div class="space-y-1">
                                ${e.topUsersList.map((u, i) => `
                                    <div class="text-xs flex justify-between items-center text-gray-300">
                                        <span class="truncate max-w-[140px]"><span class="text-gray-500 mr-1">${i + 1}.</span>${escapeHtml(u.split('(')[0].trim())}</span>
                                        <span class="text-[10px] text-purple-300 font-mono">${u.includes('(') ? u.split('(')[1].replace(')', '') : ''}</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    ` : '';

                    return `
                    <div class="emote-card-wrapper" onmouseenter="adjustGridPopoverPosition(this)">
                        ${topUsersHtml}
                        <div class="bg-darkcard border border-darkborder hover:border-purple-500 rounded-xl p-3 flex flex-col items-center text-center transition group">
                            <div class="h-16 w-full flex items-center justify-center mb-2 rounded-lg emote-img-skeleton overflow-hidden">
                                ${e.imgUrl ? `<img src="${e.imgUrl}" alt="${escapeHtml(e.name)}" loading="lazy" decoding="async" onload="handleImgLoad(this)" onerror="handleImgError(this)" class="max-h-14 max-w-full object-contain group-hover:scale-110 transition-transform">` : `<span class="text-xs text-gray-600">No Image</span>`}
                            </div>
                            <a href="${e.pageUrl}" target="_blank" class="font-semibold text-sm text-white hover:text-purple-400 truncate max-w-full">${escapeHtml(e.name)}</a>
                            <span class="text-xs text-purple-400 font-bold mt-0.5">${e.count.toLocaleString()} uses</span>
                            <div class="text-[10px] text-gray-400 mt-1 space-y-0.5">
                                <div>Added: ${e.addedFormatted}</div>
                                <div>Last Used: ${e.lastUsedFormatted}</div>
                            </div>
                        </div>
                    </div>
                    `;
                }).join('');

                const renderedImgs = gridViewContainer.querySelectorAll('img');
                renderedImgs.forEach(img => {
                    if (img.complete) {
                        if (img.naturalWidth !== 0) {
                            handleImgLoad(img);
                        } else {
                            handleImgError(img);
                        }
                    }
                });
            } else {
                gridViewContainer.classList.add('hidden');
                tableViewContainer.classList.remove('hidden');

                tableBody.innerHTML = filtered.map(e => {
                    const topUsersPopoverHtml = (e.topUsersList && e.topUsersList.length > 0) ? 
                        '<div class="top-users-popover text-left">' +
                            '<div class="text-[10px] uppercase font-bold text-purple-400 border-b border-gray-700 pb-1 mb-1.5">Top Users</div>' +
                            '<div class="space-y-1">' +
                                e.topUsersList.map((u, i) => 
                                    '<div class="text-xs flex justify-between items-center text-gray-300">' +
                                        '<span class="truncate max-w-[140px]"><span class="text-gray-500 mr-1">' + (i + 1) + '.</span>' + escapeHtml(u.split('(')[0].trim()) + '</span>' +
                                        '<span class="text-[10px] text-purple-300 font-mono">' + (u.includes('(') ? u.split('(')[1].replace(')', '') : '') + '</span>' +
                                    '</div>'
                                ).join('') +
                            '</div>' +
                        '</div>' : '';

                    const img4xPopoverHtml = e.img4xUrl ? 
                        '<div class="table-img-popover">' +
                            '<img src="' + e.img4xUrl + '" alt="' + escapeHtml(e.name) + '" loading="lazy" decoding="async" class="max-h-24 max-w-full object-contain">' +
                        '</div>' : '';

                    return '<tr class="hover:bg-darkbg/50 transition">' +
                        '<td class="p-3">' +
                            '<div class="table-popover-wrapper inline-block">' +
                                img4xPopoverHtml +
                                (e.imgUrl ? '<img src="' + e.imgUrl + '" alt="' + escapeHtml(e.name) + '" loading="lazy" decoding="async" class="w-8 h-8 object-contain cursor-pointer">' : '-') +
                            '</div>' +
                        '</td>' +
                        '<td class="p-3 font-semibold text-white truncate max-w-[160px]">' + escapeHtml(e.name) + '</td>' +
                        '<td class="p-3 font-bold text-purple-400">' + e.count.toLocaleString() + '</td>' +
                        '<td class="p-3 text-xs text-gray-400">' + e.addedFormatted + '</td>' +
                        '<td class="p-3 text-xs text-gray-400">' + e.lastUsedFormatted + '</td>' +
                        '<td class="p-3 text-xs text-gray-300 relative">' +
                            ((e.topUsersList && e.topUsersList.length > 0) ? 
                                '<div class="table-popover-wrapper relative inline-block w-full" onmouseenter="adjustPopoverPosition(this)">' +
                                    topUsersPopoverHtml +
                                    '<div class="truncate cursor-pointer text-purple-300 underline decoration-dashed decoration-gray-600 underline-offset-4 w-full">' +
                                        escapeHtml(e.topUsersList.join(', ')) +
                                    '</div>' +
                                '</div>' : '-') +
                        '</td>' +
                        '<td class="p-3">' +
                            (e.pageUrl !== '#' ? '<a href="' + e.pageUrl + '" target="_blank" class="text-xs text-purple-400 hover:underline">7TV Page</a>' : '-') +
                        '</td>' +
                    '</tr>';
                }).join('');
            }
        }

        function adjustPopoverPosition(wrapper) {
            const popover = wrapper.querySelector('.top-users-popover');
            if (!popover) return;
            const rect = wrapper.getBoundingClientRect();
            const spaceBelow = window.innerHeight - rect.bottom;
            if (spaceBelow < 330) {
                popover.classList.add('popover-open-top');
            } else {
                popover.classList.remove('popover-open-top');
            }
        }

        function adjustGridPopoverPosition(wrapper) {
            const popover = wrapper.querySelector('.top-users-popover');
            if (!popover) return;
            const rect = wrapper.getBoundingClientRect();
            const spaceAbove = rect.top;
            if (spaceAbove < 330) {
                popover.classList.add('popover-open-bottom');
            } else {
                popover.classList.remove('popover-open-bottom');
            }
        }

        function escapeHtml(str) {
            return str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m]));
        }

        searchInput.addEventListener('input', renderEmotes);
        sortSelect.addEventListener('change', renderEmotes);

        viewGridBtn.addEventListener('click', () => {
            currentView = 'grid';
            viewGridBtn.classList.replace('text-gray-400', 'text-white');
            viewGridBtn.classList.add('bg-purple-600');
            viewTableBtn.classList.replace('text-white', 'text-gray-400');
            viewTableBtn.classList.remove('bg-purple-600');
            renderEmotes();
        });

        viewTableBtn.addEventListener('click', () => {
            currentView = 'table';
            viewTableBtn.classList.replace('text-gray-400', 'text-white');
            viewTableBtn.classList.add('bg-purple-600');
            viewGridBtn.classList.replace('text-white', 'text-gray-400');
            viewGridBtn.classList.remove('bg-purple-600');
            renderEmotes();
        });

        updateSummaryStats(currentEmotes);
        renderEmotes();
    </script>
</body>
</html>
